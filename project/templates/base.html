<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Bloom & Loop Crafts{% endblock %}</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="navbar">
        
        <nav>
            
<nav class="navbar">
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('products') }}">Shop</a>
            <a href="{{ url_for('about') }}">Our Story</a>
            <a href="{{ url_for('contact') }}">Contact</a>
            <a href="{{ url_for('my_orders') }}">My Orders</a>
            <a href="{{ url_for('cart') }}" class="cart-link">
        🛒 Add to Cart
        </a>
        </nav>
    </header>

    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <div class="flash">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>Made with love, yarn and little details ♡</p>
        <p>Bloom & Loop Crafts · Handmade with care</p>
    </footer>
</body>
</html>
