<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Bloom & Loop Crafts</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8f1ed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-box {
            background: white;
            width: 90%;
            max-width: 400px;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px #00000015;
            text-align: center;
        }

        h1 {
            color: #a65d70;
        }

        p {
            color: #777;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 12px 0;
            border: 1px solid #ddd;
            border-radius: 7px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #a65d70;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #88485b;
        }

        .error {
            color: #c0392b;
            margin: 10px;
        }

        a {
            color: #a65d70;
            text-decoration: none;
        }

    </style>
</head>

<body>

    <div class="login-box">

        <h1>Bloom & Loop 🌸</h1>

        <p>Welcome back! Please login.</p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="error">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}">

            <input type="hidden"
                   name="csrf_token"
                   value="{{ csrf_token() }}">

            <input
                type="email"
                name="email"
                placeholder="Enter your Email"
                required
            >
            <div class="password-container">
    <input
        type="password"
        id="password"
        name="password"
        placeholder="Enter your Password"
        required
    >

    <button
        type="button"
        id="togglePassword"
        onclick="togglePasswordVisibility()"
    >
        👁️
    </button>
</div>

<script>
function togglePasswordVisibility() {
    const password = document.getElementById("password");
    const button = document.getElementById("togglePassword");

    if (password.type === "password") {
        password.type = "text";
        button.textContent = "🙈";
    } else {
        password.type = "password";
        button.textContent = "👁️";
    }
}
</script>

            <button type="submit">Login</button>

        </form>

        <p>Don't have an account?</p>

        <a href="{{ url_for('register') }}">
            Create New Account
        </a>

    </div>

</body>
</html>
